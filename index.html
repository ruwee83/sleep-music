<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="නිද්‍රා සංගීතය">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>🌙 නිද්‍රා සංගීතය</title>
<style>
  :root {
    --bg-start: #1a1a3e;
    --bg-mid: #0a0a1a;
    --bg-end: #000;
    --accent: #8b5cf6;
    --accent-soft: rgba(139,92,246,0.25);
    --accent-glow: rgba(139,92,246,0.5);
    --text: #e0e0f0;
    --text-dim: #7070a0;
    --star: rgba(255,255,255,0.5);
  }
  [data-theme="ocean"] {
    --bg-start: #0a2540; --bg-mid: #051a30; --bg-end: #000810;
    --accent: #38bdf8; --accent-soft: rgba(56,189,248,0.25); --accent-glow: rgba(56,189,248,0.5);
    --text: #dbeafe; --text-dim: #5c7a99;
  }
  [data-theme="forest"] {
    --bg-start: #0f2818; --bg-mid: #071a0f; --bg-end: #000;
    --accent: #4ade80; --accent-soft: rgba(74,222,128,0.25); --accent-glow: rgba(74,222,128,0.5);
    --text: #dcfce7; --text-dim: #5c8064;
  }
  [data-theme="sunset"] {
    --bg-start: #3d1f10; --bg-mid: #1a0a05; --bg-end: #000;
    --accent: #fbbf24; --accent-soft: rgba(251,191,36,0.25); --accent-glow: rgba(251,191,36,0.5);
    --text: #fef3c7; --text-dim: #8a7550;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Segoe UI', -apple-system, sans-serif;
    background: radial-gradient(ellipse at top, var(--bg-start) 0%, var(--bg-mid) 40%, var(--bg-end) 100%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 20px;
    padding-top: 60px;
    overflow-x: hidden;
    position: relative;
    transition: background 0.8s ease;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
      radial-gradient(1px 1px at 20% 30%, var(--star), transparent),
      radial-gradient(1px 1px at 60% 70%, var(--star), transparent),
      radial-gradient(2px 2px at 80% 20%, var(--star), transparent),
      radial-gradient(1px 1px at 40% 80%, var(--star), transparent),
      radial-gradient(1px 1px at 90% 60%, var(--star), transparent),
      radial-gradient(1px 1px at 10% 90%, var(--star), transparent),
      radial-gradient(1px 1px at 50% 10%, var(--star), transparent),
      radial-gradient(1px 1px at 30% 50%, var(--star), transparent);
    pointer-events: none;
    z-index: 0;
    animation: twinkle 4s ease-in-out infinite alternate;
  }
  @keyframes twinkle { from { opacity: 0.5; } to { opacity: 1; } }

  /* තේමා තේරීම */
  .themes {
    position: fixed;
    top: 16px; right: 16px;
    display: flex; gap: 8px;
    z-index: 100;
    padding: 6px 10px;
    background: rgba(0,0,0,0.3);
    border-radius: 20px;
    backdrop-filter: blur(8px);
  }
  .theme-dot {
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    transition: all 0.2s;
    padding: 0;
  }
  .theme-dot[data-theme="nebula"] { background: #8b5cf6; }
  .theme-dot[data-theme="ocean"] { background: #38bdf8; }
  .theme-dot[data-theme="forest"] { background: #4ade80; }
  .theme-dot[data-theme="sunset"] { background: #fbbf24; }
  .theme-dot.active { border-color: #fff; transform: scale(1.15); box-shadow: 0 0 12px currentColor; }

  .app {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 440px;
    text-align: center;
    padding-bottom: 40px;
  }

  h1 {
    font-size: 1.4rem;
    font-weight: 300;
    letter-spacing: 3px;
    margin-bottom: 24px;
    color: var(--accent);
    opacity: 0.9;
    transition: color 0.5s;
  }

  /* හුස්ම ගන්නා කවය */
  .orb {
    width: 170px;
    height: 170px;
    border-radius: 50%;
    margin: 0 auto 28px;
    background: radial-gradient(circle, var(--accent-glow), var(--accent-soft), transparent);
    box-shadow: 0 0 80px var(--accent-soft), inset 0 0 40px var(--accent-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: breathe 8s ease-in-out infinite;
    cursor: pointer;
    transition: box-shadow 0.3s, background 0.5s;
  }
  .orb.playing {
    box-shadow: 0 0 110px var(--accent-glow), inset 0 0 60px var(--accent-glow);
    animation-duration: 5s;
  }
  .orb-icon {
    font-size: 2.8rem;
    filter: drop-shadow(0 0 15px var(--accent-glow));
    user-select: none;
    color: #fff;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }

  /* ශබ්ද */
  .sounds {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 18px;
  }
  .sound-btn {
    background: var(--accent-soft);
    border: 1px solid var(--accent-soft);
    border-radius: 14px;
    padding: 12px 4px;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.25s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    font-size: 0.7rem;
    font-family: inherit;
  }
  .sound-btn:hover { border-color: var(--accent-glow); }
  .sound-btn.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 0 18px var(--accent-soft);
  }
  .sound-btn .emoji { font-size: 1.35rem; }

  /* ශබ්ද පාලනය */
  .volume-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
    padding: 0 8px;
  }
  .volume-row span { font-size: 1.05rem; }
  input[type="range"] {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    background: var(--accent-soft);
    border-radius: 2px;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    box-shadow: 0 0 10px var(--accent-glow);
  }
  input[type="range"]::-moz-range-thumb {
    width: 16px; height: 16px;
    border: none;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    box-shadow: 0 0 10px var(--accent-glow);
  }

  /* උඩුගත කිරීම */
  .upload-btn {
    display: block;
    width: 100%;
    padding: 12px;
    background: var(--accent-soft);
    border: 1px dashed var(--accent-soft);
    border-radius: 12px;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 0.82rem;
    margin-bottom: 6px;
    transition: all 0.3s;
    font-family: inherit;
  }
  .upload-btn:hover {
    border-color: var(--accent);
    color: var(--text);
  }
  .track-name {
    font-size: 0.78rem;
    color: var(--accent);
    margin-bottom: 16px;
    min-height: 1.2em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ටයිමරය */
  .timer-label {
    font-size: 0.7rem;
    color: var(--text-dim);
    margin-bottom: 8px;
    letter-spacing: 1.5px;
  }
  .timer-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-bottom: 12px;
  }
  .timer-btn {
    padding: 9px 2px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 0.75rem;
    transition: all 0.25s;
    font-family: inherit;
  }
  .timer-btn:hover { color: var(--text); }
  .timer-btn.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: #fff;
  }
  .timer-display {
    font-size: 1.3rem;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    min-height: 1.8em;
    letter-spacing: 2px;
    transition: color 0.5s;
  }

  /* Install button */
  .install-btn {
    display: none;
    margin-top: 20px;
    padding: 10px 18px;
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    border-radius: 20px;
    color: var(--text);
    font-size: 0.8rem;
    cursor: pointer;
    font-family: inherit;
  }
  .install-btn:hover { box-shadow: 0 0 15px var(--accent-glow); }

  .hint {
    font-size: 0.68rem;
    color: var(--text-dim);
    margin-top: 20px;
    letter-spacing: 0.5px;
    opacity: 0.6;
  }
</style>
</head>
<body data-theme="nebula">
  <div class="themes">
    <button class="theme-dot active" data-theme="nebula" aria-label="Nebula"></button>
    <button class="theme-dot" data-theme="ocean" aria-label="Ocean"></button>
    <button class="theme-dot" data-theme="forest" aria-label="Forest"></button>
    <button class="theme-dot" data-theme="sunset" aria-label="Sunset"></button>
  </div>

  <div class="app">
    <h1>🌙 නිද්‍රා සංගීතය</h1>
    
    <div class="orb" id="orb">
      <div class="orb-icon" id="orbIcon">▶</div>
    </div>

    <div class="sounds" id="soundsGrid"></div>

    <div class="volume-row">
      <span>🔊</span>
      <input type="range" id="volume" min="0" max="100" value="70">
    </div>

    <button class="upload-btn" id="uploadBtn">📁 ඔබේම ගීතයක් උඩුගත කරන්න</button>
    <input type="file" id="fileInput" accept="audio/*" hidden>
    <div class="track-name" id="trackName"></div>

    <div class="timer-label">නිද්‍රා ටයිමරය</div>
    <div class="timer-row">
      <button class="timer-btn" data-min="15">15 මි</button>
      <button class="timer-btn" data-min="30">30 මි</button>
      <button class="timer-btn" data-min="60">60 මි</button>
      <button class="timer-btn" data-min="90">90 මි</button>
    </div>
    <div class="timer-display" id="timerDisplay"></div>

    <button class="install-btn" id="installBtn">📱 Home Screen එකට එකතු කරන්න</button>

    <div class="hint">හුස්ම ගන්නා කවය තට්ටු කරන්න · ශබ්ද කිහිපයක් එකවර තෝරන්න</div>
  </div>

<script>
(() => {
  // ─── State ───
  let audioCtx = null;
  let masterGain = null;
  const activeSounds = {};      // key -> { nodes, gain }
  let uploadedAudio = null;
  let uploadedURL = null;
  let isPlaying = false;
  let timerInterval = null;
  let timerRemaining = 0;
  let lastTimerMin = 0;
  let currentTheme = 'nebula';
  let deferredPrompt = null;

  const STORAGE_KEY = 'sleep-music-v2';

  // ─── Sound Definitions ───
  const soundDefs = {
    rain:      { emoji: '🌧️', label: 'වැස්ස',     build: buildRain },
    ocean:     { emoji: '🌊', label: 'මුහුද',      build: buildOcean },
    wind:      { emoji: '💨', label: 'සුළං',       build: buildWind },
    pad:       { emoji: '🎶', label: 'තනුව',      build: buildPad },
    birds:     { emoji: '🐦', label: 'පක්ෂීන්',   build: buildBirds },
    fire:      { emoji: '🔥', label: 'ගිනි උදුන',  build: buildFire },
    waterfall: { emoji: '💧', label: 'දිය ඇල්ල',  build: buildWaterfall },
    stream:    { emoji: '🌿', label: 'දොළ',       build: buildStream }
  };

  // ─── Noise Generators ───
  function createNoiseBuffer(type) {
    const size = audioCtx.sampleRate * 3;
    const buf = audioCtx.createBuffer(1, size, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    if (type === 'pink') {
      let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
      for (let i = 0; i < size; i++) {
        const w = Math.random()*2-1;
        b0 = 0.99886*b0 + w*0.0555179;
        b1 = 0.99332*b1 + w*0.0750759;
        b2 = 0.96900*b2 + w*0.1538520;
        b3 = 0.86650*b3 + w*0.3104856;
        b4 = 0.55000*b4 + w*0.5329522;
        b5 = -0.7616*b5 - w*0.0168980;
        d[i] = (b0+b1+b2+b3+b4+b5+b6+w*0.5362) * 0.11;
        b6 = w * 0.115926;
      }
    } else if (type === 'brown') {
      let last = 0;
      for (let i = 0; i < size; i++) {
        const w = Math.random()*2-1;
        last = (last + 0.02*w) / 1.02;
        d[i] = last * 3.5;
      }
    } else {
      for (let i = 0; i < size; i++) d[i] = Math.random()*2-1;
    }
    return buf;
  }

  // ─── Sound Builders (each accepts dest node) ───
  function buildRain(dest) {
    const src = audioCtx.createBufferSource();
    src.buffer = createNoiseBuffer('pink'); src.loop = true;
    const hp = audioCtx.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 500;
    const lp = audioCtx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 6000;
    const g = audioCtx.createGain(); g.gain.value = 0.35;
    src.connect(hp).connect(lp).connect(g).connect(dest);
    src.start();
    return [src, hp, lp, g];
  }

  function buildOcean(dest) {
    const src = audioCtx.createBufferSource();
    src.buffer = createNoiseBuffer('brown'); src.loop = true;
    const lp = audioCtx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 700;
    const g = audioCtx.createGain(); g.gain.value = 0.25;
    const lfo = audioCtx.createOscillator();
    lfo.frequency.value = 0.1;
    const lfoG = audioCtx.createGain(); lfoG.gain.value = 0.18;
    lfo.connect(lfoG).connect(g.gain);
    src.connect(lp).connect(g).connect(dest);
    src.start(); lfo.start();
    return [src, lp, g, lfo, lfoG];
  }

  function buildWind(dest) {
    const src = audioCtx.createBufferSource();
    src.buffer = createNoiseBuffer('pink'); src.loop = true;
    const bp = audioCtx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 600; bp.Q.value = 0.6;
    const lfo = audioCtx.createOscillator();
    lfo.frequency.value = 0.07;
    const lfoG = audioCtx.createGain(); lfoG.gain.value = 350;
    lfo.connect(lfoG).connect(bp.frequency);
    const g = audioCtx.createGain(); g.gain.value = 0.3;
    src.connect(bp).connect(g).connect(dest);
    src.start(); lfo.start();
    return [src, bp, g, lfo, lfoG];
  }

  function buildPad(dest) {
    const nodes = [];
    const freqs = [110, 164.81, 220, 261.63];
    freqs.forEach((f, i) => {
      const osc = audioCtx.createOscillator();
      osc.type = 'sine'; osc.frequency.value = f;
      const g = audioCtx.createGain(); g.gain.value = 0.045;
      const lfo = audioCtx.createOscillator();
      lfo.frequency.value = 0.04 + i * 0.015;
      const lfoG = audioCtx.createGain(); lfoG.gain.value = 0.025;
      lfo.connect(lfoG).connect(g.gain);
      osc.connect(g).connect(dest);
      osc.start(); lfo.start();
      nodes.push(osc, g, lfo, lfoG);
    });
    return nodes;
  }

  function buildBirds(dest) {
    const g = audioCtx.createGain(); g.gain.value = 0.12;
    g.connect(dest);
    const nodes = [g];
    let stopped = false, timer = null;
    function chirp() {
      if (stopped) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      osc.type = 'sine';
      const base = 1800 + Math.random() * 2200;
      osc.frequency.setValueAtTime(base, now);
      osc.frequency.exponentialRampToValueAtTime(base * (1.2 + Math.random()*0.4), now + 0.06);
      const cg = audioCtx.createGain();
      cg.gain.setValueAtTime(0, now);
      cg.gain.linearRampToValueAtTime(1, now + 0.01);
      cg.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      osc.connect(cg).connect(g);
      osc.start(now); osc.stop(now + 0.15);
      timer = setTimeout(chirp, 200 + Math.random() * 1200);
    }
    chirp();
    nodes._cleanup = { stop: () => { stopped = true; clearTimeout(timer); } };
    return nodes;
  }

  function buildFire(dest) {
    const nodes = [];
    const src = audioCtx.createBufferSource();
    src.buffer = createNoiseBuffer('brown'); src.loop = true;
    const lp = audioCtx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 400;
    const g = audioCtx.createGain(); g.gain.value = 0.3;
    src.connect(lp).connect(g).connect(dest);
    src.start();
    nodes.push(src, lp, g);
    let stopped = false, timer = null;
    function crackle() {
      if (stopped) return;
      const now = audioCtx.currentTime;
      const len = Math.floor(audioCtx.sampleRate * 0.05);
      const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) {
        d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 4);
      }
      const s2 = audioCtx.createBufferSource();
      s2.buffer = buf;
      const bp = audioCtx.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = 800 + Math.random()*2000; bp.Q.value = 1;
      const cg = audioCtx.createGain(); cg.gain.value = 0.25 + Math.random()*0.4;
      s2.connect(bp).connect(cg).connect(g);
      s2.start(now);
      timer = setTimeout(crackle, 60 + Math.random() * 350);
    }
    crackle();
    nodes._cleanup = { stop: () => { stopped = true; clearTimeout(timer); } };
    return nodes;
  }

  function buildWaterfall(dest) {
    const src = audioCtx.createBufferSource();
    src.buffer = createNoiseBuffer('pink'); src.loop = true;
    const bp = audioCtx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 1500; bp.Q.value = 0.5;
    const g = audioCtx.createGain(); g.gain.value = 0.4;
    src.connect(bp).connect(g).connect(dest);
    src.start();
    return [src, bp, g];
  }

  function buildStream(dest) {
    const src = audioCtx.createBufferSource();
    src.buffer = createNoiseBuffer('pink'); src.loop = true;
    const bp = audioCtx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 0.8;
    const lfo = audioCtx.createOscillator();
    lfo.frequency.value = 0.3;
    const lfoG = audioCtx.createGain(); lfoG.gain.value = 200;
    lfo.connect(lfoG).connect(bp.frequency);
    const g = audioCtx.createGain(); g.gain.value = 0.28;
    src.connect(bp).connect(g).connect(dest);
    src.start(); lfo.start();
    return [src, bp, g, lfo, lfoG];
  }

  // ─── Sound Control ───
  function ensureCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = document.getElementById('volume').value / 100;
      masterGain.connect(audioCtx.destination);
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function startSound(key) {
    if (activeSounds[key]) return;
    const gainNode = audioCtx.createGain();
    gainNode.gain.value = 1.0;
    gainNode.connect(masterGain);
    const nodes = soundDefs[key].build(gainNode);
    activeSounds[key] = { nodes, gainNode };
    document.querySelector(`[data-sound="${key}"]`).classList.add('active');
  }

  function stopSound(key) {
    const entry = activeSounds[key];
    if (!entry) return;
    if (entry.nodes._cleanup) entry.nodes._cleanup.stop();
    entry.nodes.forEach(n => {
      try { if (n.stop) n.stop(); if (n.disconnect) n.disconnect(); } catch(e) {}
    });
    try { entry.gainNode.disconnect(); } catch(e) {}
    delete activeSounds[key];
    document.querySelector(`[data-sound="${key}"]`).classList.remove('active');
  }

  function toggleSound(key) {
    ensureCtx();
    if (activeSounds[key]) {
      stopSound(key);
    } else {
      startSound(key);
    }
    updateMasterState();
    saveState();
  }

  function stopAllSounds() {
    Object.keys(activeSounds).forEach(stopSound);
    if (uploadedAudio) { uploadedAudio.pause(); uploadedAudio.currentTime = 0; }
    isPlaying = false;
    updateMasterState();
    saveState();
  }

  function updateMasterState() {
    const any = Object.keys(activeSounds).length > 0 || (uploadedAudio && !uploadedAudio.paused);
    isPlaying = any;
    const orb = document.getElementById('orb');
    const icon = document.getElementById('orbIcon');
    if (isPlaying) {
      orb.classList.add('playing');
      icon.textContent = '⏸';
    } else {
      orb.classList.remove('playing');
      icon.textContent = '▶';
    }
  }

  // ─── UI: Build Sound Grid ───
  function buildSoundGrid() {
    const grid = document.getElementById('soundsGrid');
    Object.entries(soundDefs).forEach(([key, def]) => {
      const btn = document.createElement('button');
      btn.className = 'sound-btn';
      btn.dataset.sound = key;
      btn.innerHTML = `<span class="emoji">${def.emoji}</span>${def.label}`;
      btn.addEventListener('click', () => toggleSound(key));
      grid.appendChild(btn);
    });
  }

  // ─── Orb ───
  document.getElementById('orb').addEventListener('click', () => {
    ensureCtx();
    if (isPlaying) {
      stopAllSounds();
    } else {
      const toggled = Object.keys(soundDefs).filter(k =>
        document.querySelector(`[data-sound="${k}"]`).classList.contains('active')
      );
      if (toggled.length === 0) {
        startSound('rain');
      } else {
        toggled.forEach(k => { if (!activeSounds[k]) startSound(k); });
      }
      updateMasterState();
      saveState();
    }
  });

  // ─── Volume ───
  document.getElementById('volume').addEventListener('input', (e) => {
    const v = e.target.value / 100;
    if (masterGain) masterGain.gain.value = v;
    if (uploadedAudio) uploadedAudio.volume = v;
    saveState();
  });

  // ─── Upload ───
  document.getElementById('uploadBtn').addEventListener('click', () => {
    document.getElementById('fileInput').click();
  });

  document.getElementById('fileInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    ensureCtx();
    stopAllSounds();
    if (uploadedURL) URL.revokeObjectURL(uploadedURL);
    uploadedURL = URL.createObjectURL(file);
    if (!uploadedAudio) {
      uploadedAudio = new Audio();
      uploadedAudio.loop = true;
    }
    uploadedAudio.src = uploadedURL;
    uploadedAudio.volume = document.getElementById('volume').value / 100;
    document.getElementById('trackName').textContent = '🎵 ' + file.name;
    uploadedAudio.play();
    updateMasterState();
  });

  // ─── Timer ───
  function updateTimerDisplay() {
    const el = document.getElementById('timerDisplay');
    if (timerRemaining > 0) {
      const m = Math.floor(timerRemaining / 60);
      const s = timerRemaining % 60;
      el.textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
    } else {
      el.textContent = '';
    }
  }

  document.querySelectorAll('.timer-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      clearInterval(timerInterval);
      document.querySelectorAll('.timer-btn').forEach(b => b.classList.remove('active'));
      const min = parseInt(btn.dataset.min);
      lastTimerMin = min;
      saveState();
      if (min === 0) {
        timerRemaining = 0;
        updateTimerDisplay();
        return;
      }
      btn.classList.add('active');
      timerRemaining = min * 60;
      updateTimerDisplay();
      timerInterval = setInterval(() => {
        timerRemaining--;
        updateTimerDisplay();
        if (timerRemaining <= 0) {
          clearInterval(timerInterval);
          stopAllSounds();
          document.querySelectorAll('.timer-btn').forEach(b => b.classList.remove('active'));
          lastTimerMin = 0;
          saveState();
        }
      }, 1000);
    });
  });

  // ─── Theme ───
  function setTheme(name) {
    currentTheme = name;
    document.body.dataset.theme = name;
    document.querySelectorAll('.theme-dot').forEach(d => {
      d.classList.toggle('active', d.dataset.theme === name);
    });
    saveState();
  }
  document.querySelectorAll('.theme-dot').forEach(dot => {
    dot.addEventListener('click', () => setTheme(dot.dataset.theme));
  });

  // ─── Persistence ───
  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        theme: currentTheme,
        volume: parseInt(document.getElementById('volume').value),
        timerMin: lastTimerMin
      }));
    } catch(e) {}
  }

  function loadState() {
    try {
      const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      if (s.theme) setTheme(s.theme);
      if (typeof s.volume === 'number') document.getElementById('volume').value = s.volume;
      if (s.timerMin) {
        lastTimerMin = s.timerMin;
        const btn = document.querySelector(`.timer-btn[data-min="${s.timerMin}"]`);
        if (btn) {
          btn.classList.add('active');
          timerRemaining = s.timerMin * 60;
          updateTimerDisplay();
          // timer starts when user begins playback; the interval is set only on click
          // to keep it simple, restore display only
        }
      }
    } catch(e) {}
  }

  // ─── PWA Install ───
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById('installBtn').style.display = 'inline-block';
  });
  document.getElementById('installBtn').addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    document.getElementById('installBtn').style.display = 'none';
  });
  window.addEventListener('appinstalled', () => {
    document.getElementById('installBtn').style.display = 'none';
  });

  // ─── Service Worker (offline support) ───
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }

  // ─── Cleanup ───
  window.addEventListener('beforeunload', () => {
    if (uploadedURL) URL.revokeObjectURL(uploadedURL);
  });

  // ─── Init ───
  buildSoundGrid();
  loadState();
})();
</script>
</body>
</html>
